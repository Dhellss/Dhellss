# Generates the contribution-snake SVG onto the "output" branch.
# The current README does not display it, so this runs on demand only.
# To bring it back, uncomment the schedule block and add the <picture>
# element from the previous README (commit 09f42cf).

name: Generate snake animation

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 */12 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#5D6B9E&color_dots=#EEF0FF,#C9D4FF,#9BB8FF,#6E86C4,#43538A
            dist/github-snake-dark.svg?color_snake=#9BB8FF&color_dots=#161521,#2B2A3F,#5D6B9E,#9BB8FF,#E6ECFF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
